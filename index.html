<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Web FPS Game Full</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

        
        <div id="weaponSelect" style="display:none;">
            <p>Pilih Senjata:</p>
            <button data-weapon="sniper">Sniper</button>
            <button data-weapon="ak47">AK-47</button>
            <button data-weapon="mp40">MP40</button>
        </div>
    </div>

    <div id="hud" style="display:none;">
        <div id="score">Score: 0</div>
        <div id="kills">Kills: 0</div>
    </div>

    <div id="respawnMenu" style="display:none;">
        <h2>Kamu Mati!</h2>
        <button id="respawnBtn">Respawn</button>
    </div>

    <canvas id="gameCanvas" style="display:none;"></canvas>
    <script type="module" src="game.js"></script>
</body>
</html>
