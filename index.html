<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Web FPS Game</title>

<!-- Three.js UMD + loader + controls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158/examples/js/controls/PointerLockControls.js"></script>

</head>
<body style="margin:0; overflow:hidden;">

<!-- HUD -->
<div id="hud" style="position:absolute; top:10px; left:10px; color:white; font-size:18px; z-index:50;">
    <div id="score">Score: 0</div>
    <div id="kills">Kills: 0</div>
</div>

<!-- Respawn Menu -->
<div id="respawnMenu" style="display:none; position:absolute; width:100%; height:100%; background:rgba(0,0,0,0.7); text-align:center; z-index:100;">
    <h2 style="color:white; margin-top:40%;">Kamu Mati!</h2>
    <button id="respawnBtn" style="font-size:20px; padding:10px 20px; cursor:pointer;">Respawn</button>
</div>

<!-- Canvas -->
<canvas id="gameCanvas" style="display:block; width:100vw; height:100vh;"></canvas>

<!-- Game JS -->
<script src="game.js"></script>

</body>
</html>
